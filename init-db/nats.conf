# NATS JetStream Configuration
port: 4222
http_port: 8222
server_name: ops-nats
max_connections: 64k
max_control_line: 4kb

authorization {
  default_permissions = {
    publish: ["$DENY.>"]
    subscribe: ["$DENY.>"]
  }

  users = [
    {
      user: "ops_admin"
      password: "ops_admin_password"
      permissions: {
        publish: [">"]
        subscribe: [">"]
      }
    }
    {
      user: "ops_service"
      password: "ops_service_password"
      permissions: {
        publish: ["events.>", "commands.>"]
        subscribe: ["events.>", "commands.>", "telemetry.>"]
      }
    }
  ]
}

jetstream: {
  store_dir: "/data"
  max_file: 10GB
  max_memory: 1GB

  stream = {
    name: "POSITION_DATA"
    description: "Position and sensor telemetry stream"
    subjects: ["position.gnss", "position.wifi", "position.ble", "position.cellular"]
    max_age: 7d
    max_msgs: 10000000
    storage: file
    discard: old
  }

  stream = {
    name: "RISK_ASSESSMENT"
    description: "Risk scoring and threat assessment events"
    subjects: ["risk.>", "threat.>"]
    max_age: 30d
    max_msgs: 5000000
    storage: file
    discard: old
  }

  stream = {
    name: "ENVIRONMENTAL"
    description: "Environmental conditions and weather"
    subjects: ["environmental.>"]
    max_age: 30d
    max_msgs: 1000000
    storage: file
    discard: old
  }

  stream = {
    name: "ALERTS"
    description: "System alerts and notifications"
    subjects: ["alerts.>"]
    max_age: 90d
    max_msgs: 500000
    storage: file
    discard: old
  }

  stream = {
    name: "SYSTEM_EVENTS"
    description: "System health and operational events"
    subjects: ["system.>", "health.>"]
    max_age: 7d
    max_msgs: 2000000
    storage: file
    discard: old
  }
}

logging: {
  debug: false
  trace: false
  logtime: true
  file: "/data/nats.log"
  max_size: 100MB
  max_backups: 5
}

max_payload: 1MB
ping_interval: 120s
ping_max: 2
write_timeout: 5s
